<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis estudiantes | Lectura Activa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles/dashboard.css" />
    <link rel="stylesheet" href="./students.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar__brand">
          <img
            src="../../assets/logo-kinal.png"
            alt="Logo"
            onerror="this.style.display = 'none'"
          />
        </div>
        <div>
          <p class="sidebar__title">Panel docente</p>
          <nav class="nav">
            <a href="./dashboard-teacher.html" class="nav__link">Inicio</a>
            <a href="./reading-new.html" class="nav__link">Nueva lectura</a>
            <a href="./activities-edit.html" class="nav__link">Actividades</a>
            <a href="./groups.html" class="nav__link">Grupos</a>
            <a href="./students.html" class="nav__link is-active"
              >Estudiantes</a
            >
            <a href="./stats.html" class="nav__link">Estadísticas</a>
          </nav>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <span class="topbar__crumb">Lectura Activa</span>
          <div class="topbar__user">
            <span>Docente</span>
            <a href="../auth/login.html" class="topbar__logout"
              >Cerrar sesión</a
            >
          </div>
        </header>

        <main class="content">
          <div class="page-header">
            <div>
              <h1>Mis estudiantes</h1>
              <p>Lista de estudiantes inscritos en tus grupos.</p>
            </div>
          </div>

          <section class="panel">
            <div class="panel__header">
              <h2 class="panel__title">Estudiantes</h2>
              <div class="panel__actions">
                <label for="filter-group" class="visually-hidden"
                  >Filtrar por grupo</label
                >
                <select id="filter-group" class="select">
                  <option value="">Todos los grupos</option>
                </select>
              </div>
            </div>

            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Grupo</th>
                    <th>Progreso</th>
                    <th>Última actividad</th>
                  </tr>
                </thead>
                <tbody id="students-body">
                  <tr>
                    <td colspan="5" class="table__empty">
                      Cargando estudiantes...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script type="module" src="./students.js"></script>
  </body>
</html>
