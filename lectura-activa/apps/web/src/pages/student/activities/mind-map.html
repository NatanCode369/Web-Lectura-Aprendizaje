<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa mental | Lectura Activa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/activities.css">
</head>
<body>
  <nav class="topbar-student">
    <span class="topbar-student__brand">Lectura Activa</span>
    <div class="topbar-student__user">
      <span>Estudiante</span>
      <div class="topbar-student__avatar">👤</div>
    </div>
  </nav>

  <div class="activity">
    <header class="activity__header">
      <h1 class="activity__title">Mapa mental</h1>
      <span class="activity__progress" id="progress">0 / 3</span>
    </header>

    <main class="activity__body" id="body"></main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const lecturaId = params.get('lectura') || 'liebre-tortuga';
    const tipo = 'mindmap';
    const claveCompletada = `completada_${lecturaId}_${tipo}`;

    const yaCompletada = localStorage.getItem(claveCompletada);
    if (yaCompletada) {
      const r = JSON.parse(yaCompletada);
      document.getElementById('body').innerHTML = `
        <div class="activity__finish">
          <h2>Ya completaste esta actividad</h2>
          <p class="activity__score">${r.puntaje} / ${r.total}</p>
          <p class="activity__msg">No puedes repetirla.</p>
          <div class="activity__actions">
            <a href="../catalog/catalog.html" class="btn btn--primary">Volver al inicio</a>
          </div>
        </div>
      `;
      document.getElementById('progress').textContent = `${r.puntaje} / ${r.total}`;
      throw new Error('stop');
    }

    let firstNode = null, matches = 0, errores = 0;
    const $progress = document.getElementById('progress');
    const $body = document.getElementById('body');

    $body.innerHTML = `
      <p class="activity__hint">Haz clic en las parejas de conceptos que se relacionan entre sí.</p>
      <div class="mind-map">
        <div class="mind-map__node" data-pair="1">Liebre</div>
        <div class="mind-map__node" data-pair="1">Rápida</div>
        <div class="mind-map__node" data-pair="2">Tortuga</div>
        <div class="mind-map__node" data-pair="2">Constante</div>
        <div class="mind-map__node" data-pair="3">Carrera</div>
        <div class="mind-map__node" data-pair="3">Meta</div>
      </div>
    `;

    document.querySelectorAll('.mind-map__node').forEach(node => {
      node.addEventListener('click', () => {
        if (node.classList.contains('is-matched')) return;
        if (!firstNode) { firstNode = node; node.classList.add('is-selected'); return; }
        if (firstNode === node) { node.classList.remove('is-selected'); firstNode = null; return; }
        if (firstNode.dataset.pair === node.dataset.pair) {
          firstNode.classList.remove('is-selected');
          firstNode.classList.add('is-matched');
          node.classList.add('is-matched');
          matches++;
          $progress.textContent = `${matches} / 3`;
          if (matches === 3) {
            const puntaje = Math.max(1, 3 - errores + 1);
            localStorage.setItem(claveCompletada, JSON.stringify({
              puntaje, total: 3, fecha: new Date().toISOString()
            }));
            $body.innerHTML = `
              <div class="activity__finish">
                <h2>¡Todas las parejas encontradas!</h2>
                <p class="activity__score">${puntaje} / 3</p>
                <p class="activity__msg">${errores === 0 ? '¡Sin errores!' : `Con ${errores} intento${errores === 1 ? '' : 's'} fallido${errores === 1 ? '' : 's'}.`}</p>
                <p class="activity__msg">Ya no puedes repetir esta actividad.</p>
                <div class="activity__actions">
                  <a href="../catalog/catalog.html" class="btn btn--primary">Volver al inicio</a>
                </div>
              </div>
            `;
          }
        } else {
          firstNode.classList.remove('is-selected');
          errores++;
        }
        firstNode = null;
      });
    });
  </script>
</body>
</html>
