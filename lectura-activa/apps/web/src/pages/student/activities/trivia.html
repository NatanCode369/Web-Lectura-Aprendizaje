<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia | Lectura Activa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/activities.css">
</head>
<body>
  <nav class="topbar-student">
    <span class="topbar-student__brand">Lectura Activa</span>
    <div class="topbar-student__user">
      <span>Estudiante</span>
      <div class="topbar-student__avatar">👤</div>
    </div>
  </nav>

  <div class="activity">
    <header class="activity__header">
      <h1 class="activity__title">Preguntas tipo trivia</h1>
      <span class="activity__progress" id="progress">1 / 3</span>
    </header>

    <main class="activity__body" id="body"></main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const lecturaId = params.get('lectura') || 'liebre-tortuga';
    const tipo = 'trivia';
    const claveCompletada = `completada_${lecturaId}_${tipo}`;

    // 1. Verificar si ya está completada
    const yaCompletada = localStorage.getItem(claveCompletada);
    if (yaCompletada) {
      const r = JSON.parse(yaCompletada);
      document.getElementById('body').innerHTML = `
        <div class="activity__finish">
          <h2>Ya completaste esta actividad</h2>
          <p class="activity__score">${r.puntaje} / ${r.total}</p>
          <p class="activity__msg">No puedes repetirla.</p>
          <div class="activity__actions">
            <a href="../catalog/catalog.html" class="btn btn--primary">Volver al inicio</a>
          </div>
        </div>
      `;
      document.getElementById('progress').textContent = `${r.puntaje} / ${r.total}`;
      throw new Error('stop');
    }

    // 2. Si no está completada, cargar la actividad
    const guardadas = localStorage.getItem(`actividades_${lecturaId}`);
    const actividades = guardadas ? JSON.parse(guardadas) : {
      trivia: [
        { pregunta: "¿Qué animal ganó la carrera?", opciones: ["La liebre", "La tortuga", "El zorro", "El león"], correcta: 1 },
        { pregunta: "¿Por qué perdió la liebre?", opciones: ["Se lastimó", "Se durmió", "Se distrajo", "Se rindió"], correcta: 1 },
        { pregunta: "¿Cuál es la moraleja?", opciones: ["La velocidad importa", "La constancia vence", "Nunca competir", "El orgullo es bueno"], correcta: 1 }
      ]
    };

    const questions = actividades.trivia.map(q => ({
      q: q.pregunta, options: q.opciones, correct: q.correcta
    }));

    let current = 0, score = 0;
    const $body = document.getElementById('body');
    const $progress = document.getElementById('progress');

    function render() {
      const item = questions[current];
      $progress.textContent = `${current + 1} / ${questions.length}`;
      $body.innerHTML = `
        <p class="activity__question">${item.q}</p>
        <div class="options" id="options">
          ${item.options.map((text, i) => `<button class="option" data-index="${i}">${text}</button>`).join('')}
        </div>
        <div class="feedback" id="feedback" hidden></div>
        <button class="btn btn--primary" id="next" hidden>Siguiente →</button>
      `;
      document.querySelectorAll('.option').forEach(btn =>
        btn.addEventListener('click', () => selectOption(Number(btn.dataset.index))));
      document.getElementById('next').addEventListener('click', () => {
        current++;
        if (current < questions.length) render();
        else mostrarFinal(score, questions.length);
      });
    }

    function selectOption(index) {
      const item = questions[current];
      const buttons = document.querySelectorAll('.option');
      buttons.forEach(b => b.disabled = true);
      buttons[index].classList.add(index === item.correct ? 'option--correct' : 'option--wrong');
      if (index !== item.correct) buttons[item.correct].classList.add('option--correct');
      const $feedback = document.getElementById('feedback');
      if (index === item.correct) { score++; $feedback.textContent = '¡Correcto!'; $feedback.className = 'feedback feedback--ok'; }
      else { $feedback.textContent = 'Incorrecto.'; $feedback.className = 'feedback feedback--error'; }
      $feedback.hidden = false;
      document.getElementById('next').hidden = false;
    }

    function mostrarFinal(puntaje, total) {
      // Guardar como completada
      localStorage.setItem(claveCompletada, JSON.stringify({
        puntaje, total, fecha: new Date().toISOString()
      }));

      $body.innerHTML = `
        <div class="activity__finish">
          <h2>¡Actividad completada!</h2>
          <p class="activity__score">${puntaje} / ${total}</p>
          <p class="activity__msg">${puntaje === total ? '¡Perfecto!' : '¡Buen intento!'}</p>
          <p class="activity__msg">Ya no puedes repetir esta actividad.</p>
          <div class="activity__actions">
            <a href="../catalog/catalog.html" class="btn btn--primary">Volver al inicio</a>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
