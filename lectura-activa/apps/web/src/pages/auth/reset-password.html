<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva contraseña | Lectura Activa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles/auth.css" />
  </head>
  <body>
    <div class="auth">
      <header class="auth__brand">
        <img
          src="../../assets/logo-kinal.png"
          alt="Logo"
          class="auth__logo"
          onerror="this.style.display = 'none'"
        />
      </header>

      <main class="auth__grid">
        <section class="card card--dark">
          <h1 class="card__title">Define tu nueva contraseña</h1>
          <p class="card__text">
            Ingresa y confirma tu nueva contraseña para recuperar el acceso.
          </p>

          <form id="reset-form" novalidate>
            <div class="input">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V8a4 4 0 0 1 8 0v3" />
              </svg>
              <input
                type="password"
                id="new-password"
                name="newPassword"
                placeholder="Nueva contraseña (mínimo 8 caracteres)"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <div class="input">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V8a4 4 0 0 1 8 0v3" />
              </svg>
              <input
                type="password"
                id="new-password-confirm"
                name="newPasswordConfirm"
                placeholder="Confirmar nueva contraseña"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <p id="form-error" class="form-error" role="alert" hidden></p>
            <p id="form-success" class="form-success" role="status" hidden></p>

            <button type="submit" class="btn btn--primary">
              Actualizar contraseña
            </button>
          </form>
        </section>

        <section class="card card--light">
          <h2 class="card__title">¿Ya la recordaste?</h2>
          <div class="promo">
            <h3>Volver al inicio de sesión</h3>
            <p>Si ya recuerdas tu contraseña, accede a tu cuenta.</p>
            <a href="login.html" class="btn btn--orange">Iniciar sesión</a>
          </div>
        </section>
      </main>

      <footer class="auth__footer">
        © 2026 Lectura Activa. Todos los derechos reservados.
      </footer>
    </div>

    <script type="module" src="./reset-password.js"></script>
  </body>
</html>
